# Nginx + HTTPS (Let's Encrypt 적용 후 사용)
# 1) 먼저 HTTP(80)로 certbot 실행해서 인증서 발급
# 2) certbot이 이 파일을 수정하거나, 아래처럼 수동으로 443 블록 추가 후 재연결

# HTTP → HTTPS 리다이렉트 (선택: 80 포트 쓰는 경우)
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$server_name$request_uri;
# }

# HTTPS (13090에 SSL 적용하는 경우)
# 인증서 경로는 certbot 사용 시: /etc/letsencrypt/live/도메인/fullchain.pem, privkey.pem
server {
    listen 13090 ssl;
    server_name your-domain.com;   # 실제 도메인으로 변경

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/note/app/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4090/uploads/;
        proxy_set_header Host $host;
    }
}
