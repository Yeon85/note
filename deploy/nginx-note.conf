# Nginx 설정: 호스트에 직접 설치한 경우 (Docker 아님)
# 사용: sudo cp deploy/nginx-note.conf /etc/nginx/sites-available/note
#       sudo ln -s /etc/nginx/sites-available/note /etc/nginx/sites-enabled/
#       (기본 default 비활성화 후) sudo nginx -t && sudo systemctl reload nginx

server {
    listen 13090;
    # 도메인 쓰면 여기 넣기. 없으면 기본 사이트로 동작하게 둠.
    # server_name 115.68.229.141;
    # server_name your-domain.com;

    # 프론트: 빌드 결과물 (app 빌드 후 /opt/note/app/dist)
    root /opt/note/app/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → 백엔드(4090)
    location /api/ {
        proxy_pass http://127.0.0.1:4090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    # 업로드 파일
    location /uploads/ {
        proxy_pass http://127.0.0.1:4090/uploads/;
        proxy_set_header Host $host;
    }
}
